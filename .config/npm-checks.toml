# npm checks (ADR-0034), run by scripts/check_npm.py from scripts/check.sh. Any changed line needs a
# Floor-reason: trailer. Dated lists are one-line tables whose reason ends
# "Tracked in #<issue>. Review by <YYYY-MM-DD>.", which scripts/check_dated_entries.py reads.

[licenses]
# ADR-0028's list, and four more. MPL-2.0 is Lightning CSS, which Vite and Tailwind use to write our CSS; it asks
# only that changes to its own files be shared, and we change none. 0BSD is tslib, and Python-2.0 and PSF-2.0
# are argparse, which markdownlint-cli2 uses. OFL-1.1 is Inter, the typeface Tetsu serves (ADR-0035), whose
# notice is in THIRD-PARTY-NOTICES.md. BlueOak-1.0.0 is lru-cache and minimatch, which jsdom and StrykerJS use; it
# is permissive like MIT. CC-BY-4.0 is caniuse-lite, browser data StrykerJS's Babel reads; it asks for attribution
# only when shared, and test tools ship nothing (ADR-0056).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "MPL-2.0",
    "Python-2.0",
    "PSF-2.0",
    "OFL-1.1",
    "BlueOak-1.0.0",
    "CC-BY-4.0",
]

[advisories]
# An advisory we cannot clear, by its GHSA id.
ignore = [
    { id = "GHSA-fc5q-39xc-vjpf", reason = "picomatch 4.0.7 and earlier, only through Vite, Vitest, and tinyglobby at build and test time, matching globs we write; no release fixes it yet. Tracked in #146. Review by 2026-12-17." },
]

[overrides]
# Each entry in package.json's overrides, by package name: a fix the direct dependency lacks.
entries = [
    { id = "katex", reason = "markdownlint-cli2 0.24.0 brings 0.16.47, which has GHSA-238p-pmpm-9mq7. Tracked in #95. Review by 2026-12-10." },
    { id = "re2js", reason = "markdownlint-cli2 0.24.0 brings 2.8.6, which has GHSA-gg6h-894w-4m9c. Tracked in #95. Review by 2026-12-10." },
    { id = "minimatch", reason = "StrykerJS 10.1.1 pins ~10.2.4, which has GHSA-g3hv-75wg-m249; 11.0.8 passes its tests and ours. Tracked in #132. Review by 2026-12-13." },
    { id = "qs", reason = "StrykerJS 10.1.1's typed-rest-client pins 6.15.1, which has four DoS advisories fixed by 6.17.1. Tracked in #132. Review by 2026-12-13." },
]

[install-scripts]
# Each locked package with an install script, which package.json's allowScripts denies, so it never runs.
denied = [
    # An optional macOS file watcher that Vite works without.
    "fsevents",
]
