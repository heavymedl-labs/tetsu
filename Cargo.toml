[workspace]
resolver = "3"
members = ["benchmarks", "crates/*", "tools/*"]
# Cargo commands skip the benchmark harness unless asked, because it is slow to build, and the development tools,
# which scripts/check.sh runs by name.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# HTML templates (ADR-0007). Without the default config feature, which reads askama.toml and pulls in an
# unmaintained crate (ADR-0028).
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
# HTTP (ADR-0007): HTTP/1 serving on Tokio, and the matched route, which logs record in place of the path (ADR-0045).
axum = { version = "0.8", default-features = false, features = ["http1", "matched-path", "tokio"] }
deadpool-postgres = "0.14"
# Random session tokens, and codes later, from the operating system (ADR-0047).
getrandom = "0.4"
# Minifies every HTML page as it is sent (ADR-0083).
html-minifier = "6.0.1"
# Sending email over SMTP (ADR-0074): implicit TLS through rustls with the same crypto provider and roots as the
# rest of Tetsu, on Tokio, with no native TLS. At least 0.11.24, which fixed six advisories.
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
# Formats the HTML templates, in tools/format-templates only (ADR-0083).
markup-fmt = { package = "markup_fmt", version = "0.28" }
# Log export over OTLP (ADR-0049): HTTP with protobuf and optional gzip, through a blocking client on the batch
# thread, with rustls. Span fields are copied onto a record only from an allowlist. Internal logs put export
# failures on standard output.
opentelemetry = { version = "0.33.1", default-features = false, features = ["logs"] }
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false, features = ["experimental_span_attributes"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["gzip-http", "http-proto", "internal-logs", "logs", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["logs"] }
# A virtual authenticator that makes real passkeys and plays hostile clients, for login tests only (ADR-0058),
# with WebAuthn's bytes written as base64url, as a browser writes them.
passkey = "0.6"
passkey-types = { version = "0.6", features = ["serialize_bytes_as_base64_string"] }
# Property tests for Tier 1 invariants, as a dev-dependency only (ADR-0046).
proptest = "1.12"
rustls = "0.23.46"
# Seed files only; derives stay on file types in crates/tetsu (ADR-0018).
serde = { version = "1.0.229", features = ["derive"] }
# Reads Vite's manifest when the tetsu crate builds; it never reaches the binary (ADR-0034).
serde_json = "1.0.154"
# Hashing session tokens, and codes later, before they are stored (ADR-0047).
sha2 = "0.11"
# Comparing form tokens, and codes later, in constant time (ADR-0047).
subtle = "2.6"
tetsu-audit = { path = "crates/audit" }
tetsu-identity = { path = "crates/identity" }
tetsu-kernel = { path = "crates/kernel" }
tetsu-mail = { path = "crates/mail" }
tetsu-postgres = { path = "crates/postgres" }
tetsu-tenancy = { path = "crates/tenancy" }
# Compresses responses with brotli or gzip, as the browser asks, and nothing else (ADR-0039).
# Structured logs (ADR-0045): JSON lines, with no filter syntax, colors, or log-crate bridge.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
tower-http = { version = "0.7", default-features = false, features = ["compression-br", "compression-gzip"] }
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
# Passkey registration and discoverable login (ADR-0047), with each ceremony's state kept in Postgres and never
# sent to the browser, which needs the state serialisable. A login stores a passkey only if its new JSON differs
# from the stored text in nothing but the counter and backup flags, so an upgrade that writes a passkey differently
# turns every login into a storage failure, an outage: rewrite the stored passkeys in a migration first.
webauthn-rs = { version = "0.6.2", features = ["conditional-ui", "danger-allow-state-serialisation"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"

# Mutation testing builds every mutant; it needs no debug info, which makes builds and links slower.
[profile.mutants]
inherits = "test"
debug = false

[profile.dev]
debug = "line-tables-only"

# Dependencies keep no debug info: a backtrace still names the lines of Tetsu's own code, and each test binary
# loses most of its size, which target/ holds many copies of.
[profile.dev.package."*"]
debug = false
