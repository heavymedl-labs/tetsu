name: Task
description: A unit of work small enough for one pull request.
labels: [task]
projects: ["HeavyMedl/1"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions. An agent should be able to verify each one.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Rigor tier (ADR-0005)
      options:
        - "1: identity and access, money, tenant isolation"
        - "2: booking, scheduling, and any unlisted module"
        - "3: UI"
        - "None: docs or tooling"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Related ADRs, issues, or files.
