name: Benchmarks

# On demand only (ADR-0008). Builds the benchmark image once, runs the suites
# on several fresh runners, and combines the results.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Number of runs, each on a fresh runner (1 to 10)
        default: "5"
        required: true
      suites:
        description: "Comma-separated suites: db, tpl, http, rt, e2e"
        default: db,tpl,http,rt,e2e
        required: true
      scale:
        description: Multiplier for database operation counts
        default: "1"
        required: true
      seconds:
        description: Seconds of load per HTTP measurement
        default: "8"
        required: true

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    # A cold build of the benchmark image took up to 12 minutes in November 2026.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan runs
        id: plan
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          [[ "$RUNS" =~ ^([1-9]|10)$ ]] || { echo "runs must be 1 to 10" >&2; exit 1; }
          echo "matrix=$(seq "$RUNS" | jq -cs .)" >>"$GITHUB_OUTPUT"
      - name: Tag by the content the image builds from
        id: tag
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          tree=$(git ls-tree HEAD benchmarks crates Cargo.toml Cargo.lock rust-toolchain.toml | git hash-object --stdin)
          echo "image=ghcr.io/${OWNER,,}/tetsu-bench:${tree}" >>"$GITHUB_OUTPUT"
      - name: Build and push unless present
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Reusing $IMAGE"
          else
            docker build -f benchmarks/Dockerfile -t "$IMAGE" .
            docker push "$IMAGE"
          fi

  run:
    name: Run ${{ matrix.run }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.image.outputs.matrix) }}
    services:
      postgres:
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Run suites
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          RUN: ${{ matrix.run }}
          SUITES: ${{ inputs.suites }}
          SCALE: ${{ inputs.scale }}
          SECONDS_PER: ${{ inputs.seconds }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          mkdir -p results
          {
            echo "### Run $RUN runner"
            echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p')"
            echo "- vCPUs: $(nproc), memory: $(free -g | awk '/Mem:/ {print $2}') GB"
          } >>"$GITHUB_STEP_SUMMARY"
          # seccomp=unconfined lets the io_uring runtimes run; Docker blocks io_uring by default.
          docker run --rm --network host --security-opt seccomp=unconfined \
            -v "$PWD/results:/work/results" \
            -e SUITES -e SCALE -e SECONDS_PER \
            -e ADMIN_URL=postgres://postgres@localhost:5432/postgres \
            -e BENCH_DB_URL=postgres://app@localhost:5432/tetsu \
            -e OUT="results/run-$RUN.jsonl" \
            "$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-run-${{ matrix.run }}
          path: results/

  report:
    name: Report
    needs: [image, run]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-run-*
          path: results
          merge-multiple: true
      - name: Aggregate
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          python3 benchmarks/aggregate.py results report.md summary.json "Benchmarks for ${IMAGE##*:}"
          cat report.md >>"$GITHUB_STEP_SUMMARY"
          cp report.md summary.json results/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-report
          path: results/
