name: Deploy

# Started by the maintainer, never by a push, a pull request, or workflow_run (ADR-0027, ADR-0033). It deploys
# the image a passing CI run published for a commit of main, by the digest that run recorded, and builds nothing.
on:
  workflow_dispatch:
    inputs:
      rollback_to:
        description: A commit of main older than the one deployed, which CI passed. It is deployed without migrating.
        required: false
      reset:
        description: Module schemas to drop before migrating, comma-separated, such as tenancy,audit. Demo only; the data in them is lost.
        required: false
      chore:
        description: A hosted chore to run on the live image instead of deploying (#135)
        required: false
        type: choice
        default: none
        options:
          - none
          - replay
          - rename
      target:
        description: For replay, the schema of the module that recorded the event; for rename, the tenant's address, such as /login
        required: false
      value:
        description: For replay, the event's ID; for rename, the tenant's new slug
        required: false

permissions:
  contents: read

# One deploy at a time, and a second waits rather than cancelling one halfway through a migration.
concurrency:
  group: deploy
  cancel-in-progress: false

# Naming bash adds -o pipefail, which the default run shell (bash -e) leaves off, so a failed command in a pipe
# fails its step.
defaults:
  run:
    shell: bash

env:
  RENDER_CLI_VERSION: 2.31.0
  RENDER_CLI_SHA256: 1cbebf1c0e083fd4410df7096fd76205bd5d6e81c7893f2587b34f1cfe2cdf85
  RENDER_CLI_DISABLE_ANALYTICS: "1"

jobs:
  deploy:
    name: Deploy to the demo environment
    if: inputs.chore == 'none' || inputs.chore == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # To find the CI run that passed on the commit, and download the digest it recorded.
      actions: read
      # To pull the image, and to prune old ones.
      packages: write
      # To record each deploy, which is how a rollback knows the commit that is live.
      deployments: write
    steps:
      # workflow_dispatch can run from any branch, so this comes before any step that uses a secret (ADR-0027).
      - name: Deploy only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run only from main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A forward deploy is main's head, and migrates. A rollback must be older than the live commit, whose
      # migrations an older binary would refuse as missing from its code, so it skips migrating.
      - name: Choose the commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          RESET: ${{ inputs.reset }}
        run: |
          if [[ -n "$RESET" && ( -n "$ROLLBACK_TO" || ! "$RESET" =~ ^[a-z][a-z0-9_]*(,[a-z][a-z0-9_]*)*$ ) ]]; then
            echo "::error::reset takes comma-separated module schemas, and never with rollback_to."
            exit 1
          fi
          if [[ -z "$ROLLBACK_TO" ]]; then
            echo "commit=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$ROLLBACK_TO" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::rollback_to must be a full 40-character commit id."
            exit 1
          fi
          live="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=demo&per_page=1" --jq '.[0].sha // ""')"
          if [[ -z "$live" || "$ROLLBACK_TO" == "$live" ]] || ! git merge-base --is-ancestor "$ROLLBACK_TO" "$live"; then
            echo "::error::rollback_to must be older than the live commit (${live:-none recorded})."
            exit 1
          fi
          echo "commit=$ROLLBACK_TO" >>"$GITHUB_OUTPUT"
      - name: Find the digest a passing CI run recorded for that exact commit
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          # A run whose base was its own commit checked and published nothing (ADR-0064), so the newest passing run
          # that recorded a digest is the one deployed.
          runs="$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --commit "$COMMIT" \
            --status success --limit 10 --json databaseId --jq '.[].databaseId')"
          run=""
          for candidate in $runs; do
            if gh run download "$candidate" --name image-digest --dir "$RUNNER_TEMP/digest" 2>/dev/null; then
              run="$candidate"
              break
            fi
          done
          if [[ -z "$run" ]]; then
            echo "::error::No CI run that passed on $COMMIT recorded its image. Run CI on it (ADR-0023)."
            exit 1
          fi
          digest="$(<"$RUNNER_TEMP/digest/digest")"
          if [[ ! "$digest" =~ ^ghcr\.io/heavymedl-labs/tetsu@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::CI run $run recorded no usable digest."
            exit 1
          fi
          echo "Deploying $digest from CI run $run"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Pull the image
        env:
          TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$DIGEST"
          docker logout ghcr.io
      # Starts the named modules over from nothing, for a change folded into their first migrations while the demo
      # holds only seed data (docs/operations/demo-environment.md). TETSU_DEMO is set here because this workflow
      # deploys only the demo; the command checks the server first, and drops nothing on any error.
      - name: Reset
        if: inputs.reset != ''
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DIGEST: ${{ steps.image.outputs.digest }}
          RESET: ${{ inputs.reset }}
        run: |
          IFS=, read -ra schemas <<<"$RESET"
          docker run --rm -e DATABASE_URL -e TETSU_DEMO=true "$DIGEST" reset "${schemas[@]}"
      # A failed migration stops the deploy, and the running image keeps serving (ADR-0012).
      - name: Migrate
        if: inputs.rollback_to == ''
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker run --rm -e DATABASE_URL "$DIGEST" migrate
      # Hosted test 8 (ADR-0042) after every migrate: a broken isolation rule stops the deploy before Render serves it.
      - name: Check isolation
        if: inputs.rollback_to == ''
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker run --rm -e DATABASE_URL "$DIGEST" check
      # The demo businesses, from the private tetsu-demos repository, with the image being deployed (ADR-0062).
      # Seeding skips businesses that exist, so after a reset the demo is complete again. The files are read with a
      # token that reaches only that repository, and seeded as the application role, whose URL lives on Render.
      - name: Fetch the demo businesses
        if: inputs.rollback_to == ''
        env:
          GH_TOKEN: ${{ secrets.DEMOS_READ_TOKEN }}
        run: gh repo clone heavymedl-labs/tetsu-demos "$RUNNER_TEMP/tetsu-demos" -- --depth 1 --quiet
      - name: Seed the demo businesses
        if: inputs.rollback_to == ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ vars.RENDER_SERVICE_ID }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          DATABASE_URL="$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
            "https://api.render.com/v1/services/$SERVICE/env-vars/DATABASE_URL" | jq -r '.value // ""')"
          echo "::add-mask::$DATABASE_URL"
          if [[ ! "$DATABASE_URL" =~ ^postgres(ql)?:// ]]; then
            echo "::error::The Render service's DATABASE_URL could not be read as a Postgres URL."
            exit 1
          fi
          export DATABASE_URL
          docker run --rm -e DATABASE_URL -v "$RUNNER_TEMP/tetsu-demos/demos:/demos:ro" "$DIGEST" seed /demos
      - name: Install the Render CLI
        run: |
          zip="cli_${RENDER_CLI_VERSION}_linux_amd64.zip"
          curl -fsSL -o "$RUNNER_TEMP/$zip" \
            "https://github.com/render-oss/cli/releases/download/v$RENDER_CLI_VERSION/$zip"
          echo "$RENDER_CLI_SHA256  $RUNNER_TEMP/$zip" | sha256sum -c
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/$zip" "cli_v$RENDER_CLI_VERSION"
          install -D -m 755 "$RUNNER_TEMP/cli_v$RENDER_CLI_VERSION" "$RUNNER_TEMP/bin/render"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Deploy the digest
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ vars.RENDER_SERVICE_ID }}
          DIGEST: ${{ steps.image.outputs.digest }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          render deploys create "$SERVICE" --image "$DIGEST" --wait --confirm -o text
          echo "::notice::Deployed $DIGEST ($COMMIT)."
      - name: Record the deploy
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          not_recorded="::error::$COMMIT is deployed but not recorded, so a rollback still sees the previous commit as live."
          id="$(jq -n --arg ref "$COMMIT" --arg digest "$DIGEST" \
            '{ref: $ref, environment: "demo", auto_merge: false, required_contexts: [], description: $digest}' |
            gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)" || { echo "$not_recorded"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success >/dev/null ||
            { echo "$not_recorded"; exit 1; }
      # After the deploy is recorded, so a rollback still knows what is live if the pages are broken (#137). Render's
      # free instance may still be waking, which the check waits out.
      - name: Check the pages
        run: python3 scripts/smoke_check.py https://tetsu-demo.onrender.com
      # Housekeeping after a good deploy, so a failure warns rather than failing the run.
      - name: Prune old images
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          versions="/orgs/heavymedl-labs/packages/container/tetsu/versions"
          prune() {
            gh api --paginate "$versions" --jq '.[] | {id, name, created_at}' >"$RUNNER_TEMP/versions" &&
              python3 scripts/prune_images.py --deployed "${DIGEST#*@}" <"$RUNNER_TEMP/versions" >"$RUNNER_TEMP/old" &&
              while read -r id; do gh api -X DELETE "$versions/$id" >/dev/null || return 1; done <"$RUNNER_TEMP/old"
          }
          if ! prune; then
            echo "::warning::The deploy succeeded, but pruning old images failed; see this step's log."
          fi

  # The demo's hosted chores, run from the image live on the demo rather than by hand in psql (#135). Each runs a
  # `tetsu` command as the application role, whose URL lives only on the Render service, so it is read from there
  # and masked. The runbook in docs/operations/demo-environment.md says when to use each.
  chore:
    name: Run a chore on the demo
    if: inputs.chore == 'replay' || inputs.chore == 'rename'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To read which image is live, from the deploy record.
      deployments: read
      # To pull that image.
      packages: read
    steps:
      # workflow_dispatch can run from any branch, so this comes before any step that uses a secret (ADR-0027).
      - name: Run only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Chores run only from main."
          exit 1
      # Inputs reach the shell only through the environment, and only in the shapes the commands take.
      - name: Check the inputs
        env:
          CHORE: ${{ inputs.chore }}
          TARGET: ${{ inputs.target }}
          VALUE: ${{ inputs.value }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          RESET: ${{ inputs.reset }}
        run: |
          if [[ -n "$ROLLBACK_TO" || -n "$RESET" ]]; then
            echo "::error::A chore runs alone, without rollback_to or reset."
            exit 1
          fi
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          case "$CHORE" in
            replay) [[ "$TARGET" =~ ^[a-z][a-z0-9_]*$ && "$VALUE" =~ $uuid ]] ;;
            rename) [[ "$TARGET" =~ ^/[a-z0-9-]+$ && "$VALUE" =~ ^[a-z0-9-]+$ ]] ;;
            *) false ;;
          esac || { echo "::error::$CHORE takes another shape of target and value; see the input descriptions."; exit 1; }
      - name: Find the live image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=demo&per_page=1" --jq '.[0].description // ""')"
          if [[ ! "$digest" =~ ^ghcr\.io/heavymedl-labs/tetsu@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No deploy of the demo is recorded with an image digest."
            exit 1
          fi
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Pull the image
        env:
          TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$DIGEST"
          docker logout ghcr.io
      - name: Run the chore
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ vars.RENDER_SERVICE_ID }}
          DIGEST: ${{ steps.image.outputs.digest }}
          CHORE: ${{ inputs.chore }}
          TARGET: ${{ inputs.target }}
          VALUE: ${{ inputs.value }}
        run: |
          DATABASE_URL="$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
            "https://api.render.com/v1/services/$SERVICE/env-vars/DATABASE_URL" | jq -r '.value // ""')"
          echo "::add-mask::$DATABASE_URL"
          if [[ ! "$DATABASE_URL" =~ ^postgres(ql)?:// ]]; then
            echo "::error::The Render service's DATABASE_URL could not be read as a Postgres URL."
            exit 1
          fi
          export DATABASE_URL
          docker run --rm -e DATABASE_URL "$DIGEST" "$CHORE" "$TARGET" "$VALUE"
