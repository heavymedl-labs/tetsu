name: CI

# On demand and on pull requests, not on every push: the pre-push hook runs the same checks first, and a manual
# run checks the whole batch since the last successful one (ADR-0023).
on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Commit to check every change since. Empty means the last commit a successful manual run checked.
        required: false

# Each job asks for what it needs, and nothing is granted to all of them.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    # The longest pass took 44 minutes, mutating nine commits on one runner (2026-11-16); a hang stops at twice that.
    timeout-minutes: 90
    permissions:
      contents: read
      # To find the commit the last successful run checked.
      actions: read
    services:
      postgres:
        # At least MIN_SERVER_VERSION in crates/postgres/src/migrate.rs (ADR-0060).
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # npm's download cache, keyed by the lockfile; check.sh installs from it without scripts (ADR-0034).
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry
            ~/.rustup/toolchains/nightly-*
            .tools
            target
          key: tools-${{ hashFiles('scripts/install-tools.sh', 'Cargo.lock', 'rust-toolchain.toml', '.config/nightly-toolchain') }}
          # A new key starts from the latest cache, so only what changed is rebuilt, and saves under the new key.
          restore-keys: tools-
      # The settings in check.sh's setup hint, since services take no server flags: throwaway data traded for
      # speed, and TLS with the image's self-signed certificate, which the TLS tests must refuse.
      - run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -q \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "ALTER SYSTEM SET ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'" \
            -c "ALTER SYSTEM SET ssl = on" \
            -c "SELECT pg_reload_conf()"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: scripts/install-tools.sh
      # A pull request checks against its base. A manual run checks every change since the base it is given, or
      # since the commit the last successful manual run on main checked. Only manual runs count: a pull request
      # run checks its own diff, not main's batch. With neither, it fails rather than check too little.
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          base="${PR_BASE:-$INPUT_BASE}"
          if [[ -z "$base" ]]; then
            base="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --event workflow_dispatch --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          fi
          if [[ -z "$base" ]]; then
            echo "::error::No successful manual run on main to check changes since. Run again with the base input set."
            exit 1
          fi
          # A full commit SHA, so the value can never reach git as an option.
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The base must be a full commit SHA."
            exit 1
          fi
          echo "sha=$base" >>"$GITHUB_OUTPUT"
      # After a force push the old head is on no branch, so fetch it by its SHA.
      - run: |
          git fetch --quiet origin "$BASE" || true
          scripts/check.sh --base "$BASE"
        env:
          BASE: ${{ steps.base.outputs.sha }}
      # The benchmark harness builds about twenty crates nothing else uses, so it is checked only when something it
      # builds from changed, and outside the cached target folder, which would grow by about 1 GB.
      - name: The benchmark harness compiles, if anything it builds from changed
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- benchmarks Cargo.toml Cargo.lock rust-toolchain.toml; then
            echo "The benchmark harness and what it builds from are unchanged since $BASE, so it is not checked."
          else
            CARGO_TARGET_DIR="$RUNNER_TEMP/bench" cargo check --locked -p tetsu-bench
          fi

  # One job, since GitHub bills each job rounded up to a minute and these are short (ADR-0023, ADR-0063).
  rest:
    name: Image, links, and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image's Rust dependencies are a layer of their own, which lasts until a manifest or the lockfile changes
      # (Dockerfile), so it is kept between runs and imported rather than built again: a new cache is exported only
      # when the key changes. A builder of Docker's own BuildKit, pinned as every image here is, imports and exports
      # one (ADR-0063).
      - id: image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image-cache
          key: image-${{ hashFiles('Dockerfile', '**/Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'package-lock.json') }}
          restore-keys: image-
      - env:
          CACHE: ${{ runner.temp }}/image-cache
          HIT: ${{ steps.image-cache.outputs.cache-hit }}
        run: |
          docker buildx create --use --driver docker-container \
            --driver-opt image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          export=()
          if [[ "$HIT" != true ]]; then export=(--cache-to "type=local,dest=$CACHE-new,mode=max"); fi
          docker buildx build --load -t tetsu:ci --cache-from "type=local,src=$CACHE" "${export[@]}" .
          if [[ "$HIT" != true ]]; then rm -rf "$CACHE" && mv "$CACHE-new" "$CACHE"; fi
      - run: docker run --rm tetsu:ci
      # The publish job pushes this exact image once every check has passed (ADR-0033).
      - name: Keep the image for publishing
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: docker save tetsu:ci | gzip >image.tar.gz
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
      - name: All links outside research
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --include-fragments --exclude-path docs/research "**/*.md"
          fail: true
      # Research cites third-party pages that move or block bots; check only its internal links.
      - name: Internal links in research
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --include-fragments --offline "docs/research/**/*.md"
          fail: true
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  # Publishes the image the run checked, once every check passed, and records its digest for the deploy
  # (ADR-0033). Never from a pull request. It holds the only write token and runs only GitHub's own actions.
  publish:
    name: Publish the image
    needs: [checks, rest]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    # Naming bash adds -o pipefail, so a failed gunzip fails the push rather than loading a truncated image.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Push the image, tagged with its commit, and record its digest
        env:
          TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/heavymedl-labs/tetsu:${{ github.sha }}
        run: |
          gunzip -c image.tar.gz | docker load
          docker tag tetsu:ci "$IMAGE"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker logout ghcr.io
          # The image may carry digests under other names, such as the one it was loaded as, in any order, so the
          # pushed one is picked by its repository; finding none fails the job rather than record another.
          docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE" |
            grep -m1 '^ghcr\.io/heavymedl-labs/tetsu@sha256:[0-9a-f]\{64\}$' >digest
          cat digest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: digest
