[package]
name = "tetsu-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Stack benchmarks for ADR-0007 and ADR-0008. Not product code."

[dependencies]
# Without askama's default config feature, which pulls in the unmaintained basic-toml (RUSTSEC-2026-0374).
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
axum = "0.8"
# Without default features, which bring h2 (RUSTSEC-2026-0258). 4.19 is the first that needs actix-http 3.21,
# past both actix advisories' fixes (RUSTSEC-2026-0446 and -0447), so a later `cargo update` cannot resolve back
# to them (ADR-0028).
actix-web = { version = "4.19", default-features = false, features = ["macros"] }
chrono = "0.4"
cornucopia = { path = "cornucopia", default-features = false, features = ["deadpool"] }
deadpool-postgres = "0.14"
diesel = { version = "2.3", default-features = false, features = ["postgres_backend", "chrono"] }
diesel-async = { version = "0.9", features = ["postgres", "deadpool"] }
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
bytes = "1"
libc = "0.2"
maud = "0.27"
rand = "0.9"
sailfish = "0.11"
salvo = { version = "1.1", default-features = false, features = ["server", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "macros"] }
tokio = { version = "1.54", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "request-id"] }

[target.'cfg(target_os = "linux")'.dependencies]
compio = { version = "0.19", features = ["macros", "runtime", "net", "io-uring"] }
monoio = { version = "0.2", features = ["iouring", "sync"] }
