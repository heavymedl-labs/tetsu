{#- The one action a page offers, in the shared button's look, enabled by the passkey script once it can run it. -#}
{% import "../../../web/templates/components.html" as shared %}
{% macro passkey(action, form = "") %}
<button type="button" data-passkey="{{ action }}"{% if !form.is_empty() %} data-form="{{ form }}"{% endif %} disabled class="mt-8 w-full disabled:cursor-not-allowed disabled:opacity-50 {% call shared::button_style() %}{% endcall %}">{{ caller() }}</button>
{% endmacro %}
