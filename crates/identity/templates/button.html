{#- The one action a page offers, enabled by the passkey script once it can run it. -#}
{% macro passkey(action, form = "") %}
<button type="button" data-passkey="{{ action }}"{% if !form.is_empty() %} data-form="{{ form }}"{% endif %} disabled class="mt-8 w-full rounded-full bg-ink px-5 py-2.5 text-sm font-medium text-canvas transition-opacity hover:opacity-85 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50">{{ caller() }}</button>
{% endmacro %}
