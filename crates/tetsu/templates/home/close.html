{% import "../../../web/templates/components.html" as ui %}
{% import "art/figures.html" as fig %}
<section aria-labelledby="close" class="relative overflow-hidden py-22 text-center sm:py-32 lg:py-44">
<div aria-hidden="true" class="pointer-events-none absolute inset-x-0 bottom-0 -z-10 flex h-28 justify-center sm:h-32 lg:h-36 [mask-image:radial-gradient(ellipse_at_bottom,black,transparent_70%)]">{% call fig::strip() %}{% endcall %}</div>
<div class="tetsu-reveal mx-auto max-w-page px-6 lg:px-10">
<h2 id="close" class="text-4xl/[1.05] font-semibold tracking-[-0.04em] text-balance text-ink sm:text-6xl/[1.05]">Your schedule. Your customers. <br><span class="text-muted">Your terms.</span></h2>
<div class="mt-10">{% call ui::button("#pricing") %}Compare plans{% endcall %}</div>
</div>
</section>
