{% import "../../../web/templates/components.html" as ui %}
{% import "art/figures.html" as fig %}
<section aria-labelledby="close" class="relative overflow-hidden [contain-intrinsic-size:auto_40rem] [content-visibility:auto] pt-22 pb-26 text-center sm:pt-16 sm:pb-32 lg:pb-40">
<div aria-hidden="true" class="pointer-events-none absolute inset-x-0 bottom-0 -z-10 flex h-14 justify-center sm:h-20 lg:h-28 [mask-image:radial-gradient(ellipse_at_bottom,black,transparent_70%)]">{% call fig::strip() %}{% endcall %}</div>
<div class="tetsu-reveal mx-auto max-w-page px-(--tetsu-gutter)">
<h2 id="close" class="text-3xl font-medium text-balance text-ink sm:text-5xl lg:text-6xl">Your schedule. Your customers. <br><span class="text-muted">Your terms.</span></h2>
<div class="mt-10">{% call ui::button("#pricing") %}Compare plans{% endcall %}</div>
</div>
</section>
