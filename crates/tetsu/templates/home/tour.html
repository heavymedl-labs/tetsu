{#- One slide of the root page's product tour: its tab's title and line, shown on phones where there are no tabs,
    and the panel the caller gives. -#}
{% macro slide(tab) %}
<div id="{{ tab.0 }}" class="tetsu-slide scroll-mt-24">
<h3 class="font-medium text-ink md:sr-only">{{ tab.1 }}</h3>
<p class="mt-1 text-sm text-muted md:sr-only">{{ tab.2 }}</p>
{{ caller() }}
</div>
{% endmacro %}
