[package]
name = "tetsu"
description = "The Tetsu binary, which wires modules together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
serde.workspace = true
tetsu-kernel.workspace = true
tetsu-postgres.workspace = true
tetsu-tenancy.workspace = true
# Signals to stop serving, and a channel to bound the drain once stopping.
tokio = { workspace = true, features = ["signal", "sync"] }
toml.workspace = true

[dev-dependencies]
# Reading and writing sockets in its tests.
tokio = { workspace = true, features = ["io-util"] }

[package.metadata.tetsu]
kind = "root"
tier = 2

[lints]
workspace = true
