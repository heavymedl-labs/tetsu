[package]
name = "tetsu"
description = "The Tetsu binary, which wires modules together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
askama.workspace = true
axum.workspace = true
serde.workspace = true
# The manifest reader build.rs shares is compiled here too, so its tests and mutants cover it; the binary uses none
# of it.
serde_json.workspace = true
tetsu-audit.workspace = true
tetsu-kernel.workspace = true
tetsu-postgres.workspace = true
tetsu-tenancy.workspace = true
tower-http.workspace = true
# Signals to stop serving, and a channel to bound the drain once stopping.
tokio = { workspace = true, features = ["signal", "sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
# Reads Vite's manifest, to embed the front-end build (ADR-0034).
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Reading and writing sockets in its tests.
tokio = { workspace = true, features = ["io-util"] }

[package.metadata.tetsu]
kind = "root"
tier = 2

[lints]
workspace = true
