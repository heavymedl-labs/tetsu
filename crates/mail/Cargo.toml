[package]
name = "tetsu-mail"
description = "Email: the Mailer's adapters, the record of what was sent, and the mailbox of what was kept."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.tetsu]
kind = "platform"
tier = 1

[dependencies]
deadpool-postgres.workspace = true
lettre.workspace = true
rustls.workspace = true
tetsu-kernel.workspace = true
tetsu-postgres.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-postgres.workspace = true
tracing.workspace = true

[dev-dependencies]
# Reading Mailpit's API in the SMTP tests.
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }

[lints]
workspace = true
